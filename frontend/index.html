<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ONCO-CARE</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#8b0f1f">
<style>
:root{--red:#8b0f1f;--crim:#c1121f;--bl:#f8e3e2;--ln:#ecd5d3}*{box-sizing:border-box}body{margin:0;background:#fbf6f2;color:#2a0d12;font:15px/1.5 system-ui,sans-serif}
header{background:linear-gradient(90deg,#5c0a15,var(--red));color:#fff;padding:12px 18px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}main{max-width:1000px;margin:auto;padding:18px}
.card{background:#fff;border:1px solid var(--ln);border-radius:14px;padding:16px;margin-bottom:14px}button{background:var(--crim);color:#fff;border:0;border-radius:99px;padding:8px 16px;cursor:pointer;font-weight:600}button.o{background:#fff;color:var(--crim);border:1px solid var(--crim)}button.on{background:var(--red);color:#fff}
input,select{width:100%;padding:8px;border:1px solid var(--ln);border-radius:8px;margin:4px 0}input[type=range]{accent-color:var(--crim)}table{width:100%;border-collapse:collapse}th{background:var(--red);color:#fff;text-align:left;padding:8px}td{padding:8px;border-bottom:1px solid var(--ln)}tr.c{cursor:pointer}tr.c:hover{background:var(--bl)}
.b{color:#fff;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700}.RED{background:#d62839}.YELLOW{background:#e0a800;color:#2a1d00}.GREEN{background:#2e9e5b}.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.err{color:#d62839}small{color:#7a5a5f}.big{font-size:28px;font-weight:700}
</style></head><body><header><b>♥ ONCO-CARE <small style="color:#f6c">prototype · simulated data only</small></b><span id="who"></span></header><main id="app"></main>
<script>
const $=s=>document.querySelector(s);let T=sessionStorage.t||'',ROLE=sessionStorage.r||'',NAME=sessionStorage.n||'',TAB='open',LV='ALL',P=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const S=[['fever','Fever'],['nausea','Nausea'],['vomiting','Vomiting'],['diarrhea','Diarrhea'],['pain','Pain'],['fatigue','Fatigue'],['appetite_loss','Appetite loss']];
const COL=['#c1121f','#e07a1f','#8b0f1f','#2e9e5b','#2b6cb0','#6b46c1','#718096'];
const api=async(p,m='GET',b)=>{const r=await fetch('/api'+p,{method:m,headers:{'Content-Type':'application/json',Authorization:'Bearer '+T},body:b?JSON.stringify(b):undefined});const j=await r.json().catch(()=>({}));if(!r.ok){if(r.status==401&&T)out();throw Error(typeof j.detail=='string'?j.detail:'Please check your inputs')}return j};
const B=l=>l?`<span class="b ${esc(l)}">${esc(l)}</span>`:'—',out=()=>{sessionStorage.clear();T='';location.reload()};
const pts=(a,w,h,m,j)=>a.map((v,i)=>(10+i*(w-20)/Math.max(1,a.length-1))+','+(h-8-v/m*(h-16))).join(' ');
const spark=a=>`<svg viewBox="0 0 300 80" width="100%"><polyline fill="none" stroke="#8b0f1f" stroke-width="2.5" points="${pts(a,300,80,Math.max(8,...a))}"/></svg>`;
const multi=ck=>`<svg viewBox="0 0 360 120" width="100%">${S.map((s,j)=>`<polyline fill="none" stroke="${COL[j]}" stroke-width="2" points="${pts(ck.map(c=>c.data[s[0]]),360,120,10)}"/>`).join('')}</svg><div>${S.map((s,j)=>`<small style="color:${COL[j]}">● ${s[1]} </small>`).join('')}</div>`;
function auth(){$('#app').innerHTML=`<div class="card" style="max-width:400px;margin:30px auto"><h2>Sign in</h2><input id=e placeholder="Email"><input id=p type=password placeholder="Password (8+ chars)"><input id=nm placeholder="Your name (for registration)"><label><input type=checkbox id=cs style="width:auto"> I consent to my symptom data being stored for care-team review (simulated prototype).</label><div id=m class=err></div><p><button onclick="go()">Sign in</button> <button class=o onclick="reg()">Register as patient</button></p><small>Demo (after python seed.py): p0@demo.test or doc@demo.test / demo1234</small></div>`}
async function go(){try{const r=await api('/auth/login','POST',{email:$('#e').value,password:$('#p').value});T=r.token;ROLE=r.role;NAME=r.name;Object.assign(sessionStorage,{t:T,r:ROLE,n:NAME});start()}catch(x){$('#m').textContent=x.message}}
async function reg(){try{await api('/auth/register','POST',{email:$('#e').value,password:$('#p').value,name:$('#nm').value||$('#e').value.split('@')[0],consent:$('#cs').checked});$('#m').textContent='';await go()}catch(x){$('#m').textContent=x.message}}
function start(){$('#who').innerHTML=`${esc(NAME)} (${esc(ROLE)}) <button class=o onclick="out()">Sign out</button>`;ROLE=='patient'?patient():clin()}
async function patient(){const h=await api('/checkins/me');$('#app').innerHTML=`<div class="g"><div class="card"><h2>Good morning, ${esc(NAME)}</h2><b>How are you feeling today?</b>${S.map(s=>`<label>${s[1]}: <b id="o${s[0]}">0</b>/10<input type=range min=0 max=10 value=0 id="s${s[0]}" oninput="o${s[0]}.textContent=this.value"></label>`).join('')}<label>Temperature °C<input id=tp type=number step=.1 value=36.8></label><label>Weight kg<input id=wt type=number step=.1></label><label><input type=checkbox id=md checked style="width:auto"> Medication taken</label><div id=r></div><button id=sb onclick="sub()">Submit Daily Check-In</button><p><small>If you feel very unwell, contact your care team or emergency services directly. This app is not monitored in real time.</small></p></div><div><div class=card><h3>My trend (risk score)</h3>${spark(h.slice().reverse().map(x=>x.score))}</div><div class=card><h3>Previous check-ins</h3>${h.slice(0,7).map(x=>`<p>${esc(x.ts.slice(0,10))} ${B(x.level)}</p>`).join('')||'<small>No check-ins yet</small>'}</div></div></div>`}
async function sub(){const b={temp:+$('#tp').value,medication_taken:$('#md').checked};if($('#wt').value)b.weight=+$('#wt').value;S.forEach(s=>b[s[0]]=+$('#s'+s[0]).value);$('#sb').disabled=true;$('#r').textContent='Saving…';try{const a=await api('/checkins','POST',b);await patient();$('#r').innerHTML=`<p>✓ Recorded. ${B(a.level)} ${a.level=='GREEN'?'Looks stable.':'Your care team can see this for review.'}</p>`}catch(x){$('#r').innerHTML=`<p class=err>${esc(x.message)}</p>`;$('#sb').disabled=false}}
async function clin(){const[p,a,an]=await Promise.all([api('/patients'),api('/alerts?status='+TAB),api('/analytics')]);P=p;const n=l=>p.filter(x=>x.level==l).length,al=a.filter(x=>LV=='ALL'||x.level==LV);
$('#app').innerHTML=`<h2>Clinical Dashboard</h2><div class=g><div class=card><div class=big>${p.length}</div>Monitored</div><div class=card><div class=big>${n('GREEN')}</div>Stable</div><div class=card><div class=big>${n('YELLOW')}</div>Needs attention</div><div class=card><div class=big>${n('RED')}</div>Urgent review</div></div>
<div class=card><b>Check-ins per day (last 14 days)</b>${spark(an.per_day.map(d=>d.n))}</div><input id=q placeholder="Search patient…" oninput="tb()"><br><br><div class=card style="overflow-x:auto"><table><tr><th>Patient<th>Risk<th>Why<th>Last check-in<tbody id=tb></tbody></table></div>
<h3>Alerts</h3><p>${['open','resolved'].map(t=>`<button class="${TAB==t?'on':'o'}" onclick="TAB='${t}';clin()">${t}</button>`).join(' ')} ${['ALL','RED','YELLOW'].map(l=>`<button class="${LV==l?'on':'o'}" onclick="LV='${l}';clin()">${l}</button>`).join(' ')}</p>
${al.map(x=>`<div class=card>${B(x.level)} <b>${esc(x.name)}</b> — ${esc(x.reasons.join('; '))}<br><small>${esc(x.ts)}${x.notes.length?' · '+x.notes.length+' note(s)':''}</small><br><button class=o onclick="pd(${+x.patient_id})">Review</button> <button class=o onclick="nt(${+x.id})">Add note</button> ${TAB=='open'?`<button onclick="rs(${+x.id})">Resolve</button>`:''}</div>`).join('')||'<small>No alerts</small>'}<div id=d></div>`;tb()}
function tb(){const q=($('#q')?.value||'').toLowerCase();$('#tb').innerHTML=P.filter(x=>x.name.toLowerCase().includes(q)).map(x=>`<tr class=c onclick="pd(${+x.id})"><td>${esc(x.name)}${x.mine?'':' <small>(unassigned)</small>'}<td>${B(x.level)}<td>${esc(x.reasons[0]||'—')}<td>${x.last?esc(x.last.slice(0,16)):'—'}</tr>`).join('')}
async function pd(id){const p=await api('/patients/'+id),l=p.checkins[p.checkins.length-1];$('#d').innerHTML=`<div class=card><h3>${esc(p.name)} — detail</h3>${p.assigned?'<small>Assigned to you</small>':`<button class=o onclick="claim(${+p.id})">Claim patient</button>`}<br><b>Risk score over time</b>${spark(p.checkins.map(c=>c.score))}<b>Symptoms over time</b>${multi(p.checkins)}${l?`<h4>Why is the latest check-in ${B(l.level)}?</h4><ul>${l.reasons.map(r=>`<li>${esc(r)}</li>`).join('')||'<li>No rules triggered</li>'}</ul><small>Score ${l.score} (YELLOW ≥ 3, RED ≥ 6). Thresholds are placeholders pending oncologist review.</small>`:''}<h4>Recent check-ins</h4>${p.checkins.slice(-5).reverse().map(c=>`<p>${esc(c.ts.slice(0,16))} ${B(c.level)} ${esc(c.reasons.join('; '))}</p>`).join('')}<small>Workflow support only — not an automated medical decision.</small></div>`;$('#d').scrollIntoView()}
async function claim(id){await api(`/patients/${id}/claim`,'POST');clin()}async function rs(id){await api(`/alerts/${id}/resolve`,'POST');clin()}async function nt(id){const t=prompt('Clinical note');if(t){await api(`/alerts/${id}/notes`,'POST',{text:t});clin()}}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
T?start():auth();
</script></body></html>
